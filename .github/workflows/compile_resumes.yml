name: Compile Print-Ready Résumés

# Triggers whenever the underlying data or template changes. Only files that
# feed generate_cv.py are watched, so the commit this workflow makes back
# (which only touches compiled cv_*.html output) never re-triggers itself.
on:
  push:
    branches: ["main"]
    paths:
      - "portfolio/data.yaml"
      - "portfolio/cv_template.html"
      - "portfolio/generate_cv.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # 1. Read the focus-track ids straight out of data.yaml so the matrix
  #    below never drifts out of sync with metadata.cv_focus_tracks —
  #    add a new track in the data file and CI picks it up automatically.
  # ---------------------------------------------------------------------
  discover-tracks:
    runs-on: ubuntu-latest
    outputs:
      tracks: ${{ steps.list.outputs.tracks }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: List focus tracks (+ master)
        id: list
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, yaml

          data = yaml.safe_load(pathlib.Path("portfolio/data.yaml").read_text()) or {}
          tracks = [t["id"] for t in (data.get("metadata") or {}).get("cv_focus_tracks") or []]
          tracks.append("master")
          print(f"tracks={json.dumps(tracks)}")
          PY

  # ---------------------------------------------------------------------
  # 2. Compile each track in parallel. Each matrix run is an isolated,
  #    ephemeral checkout, so every job uploads only the single HTML file
  #    it just produced as a uniquely-named artifact.
  # ---------------------------------------------------------------------
  compile:
    needs: discover-tracks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        track: ${{ fromJson(needs.discover-tracks.outputs.tracks) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pyyaml jinja2

      - name: Compile ${{ matrix.track }} CV
        run: python portfolio/generate_cv.py "${{ matrix.track }}"

      - name: Upload compiled CV
        uses: actions/upload-artifact@v4
        with:
          name: cv-${{ matrix.track }}
          path: portfolio/cv_*.html
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------
  # 3. Collect every compiled variant and commit them back to portfolio/
  #    in a single commit — done as its own job (rather than pushing from
  #    each matrix run) so parallel jobs never race on the same branch.
  # ---------------------------------------------------------------------
  commit:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all compiled CVs
        uses: actions/download-artifact@v4
        with:
          pattern: cv-*
          path: portfolio
          merge-multiple: true

      - name: Commit compiled résumés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/cv_*.html
          if git diff --cached --quiet; then
            echo "No changes to compiled résumés — nothing to commit."
          else
            git commit -m "chore: recompile résumés from data.yaml [skip ci]"
            git push
          fi
