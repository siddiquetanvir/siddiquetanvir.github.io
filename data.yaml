# ==============================================================================
# PROJECTS (Featured on Home & Filterable on /projects.html)
# Categories: "Automated Bot", "WebApp", "ML/AI"
# ==============================================================================
projects:
  - title: "Wikimedia Campaign Analytics"
    category: "WebApp"
    tags: ["Python", "Streamlit", "Data Visualization", "REST APIs"]
    description: "An interactive web app providing retention metrics and raw data visualization across open-knowledge initiatives."
    github: "https://github.com/siddiquetanvir/WebApp"
    demo: "https://wikistats.streamlit.app/"
    featured: true

  - title: "Wikipedia Bot & Categorization Framework"
    category: "Automated Bot"
    tags: ["Python", "JupyterLab", "Pywikibot", "Taxonomy Automation"]
    description: "Custom Python framework (TanvirSdqBot) executing cross-wiki updates, user onboarding, and automated taxonomy management."
    github: "https://github.com/siddiquetanvir/TanvirSdqBot"
    featured: true

  - title: "Low-Resource NLP Toolkit (Fulfulde & Basque)"
    category: "ML/AI"
    tags: ["Python", "NLP", "Linguistics", "Tokenization"]
    description: "Exploratory scripts, morpho-syntactic tokenization experiments, and corpus curation for underrepresented languages."
    github: "https://github.com/siddiquetanvir"
    featured: true

  - title: "Wikidata Entity & Property Consistency Bot"
    category: "Automated Bot"
    tags: ["Pywikibot", "Wikidata", "SPARQL", "Taxonomy"]
    description: "Automated batch validation of multilingual statement claims and taxonomy tree reconciliation across Wikidata items."
    github: "https://github.com/siddiquetanvir/TanvirSdqBot"
    featured: false

  - title: "Open Knowledge Retention Dashboard"
    category: "WebApp"
    tags: ["Python", "Pandas", "Streamlit", "APIs"]
    description: "Cohort retention analysis tool measuring editor onboarding, edit frequency, and longevity in community campaigns."
    github: "https://github.com/siddiquetanvir/WebApp"
    featured: false

