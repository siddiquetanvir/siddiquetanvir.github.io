<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<script>
  /* Set the theme before first paint to avoid a flash of the wrong theme.
     Falls back silently if storage is unavailable (private browsing, etc). */
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#about">Skip to content</a>

<!-- Sidebar quick-jump navigation. Repositions to a bottom dock on narrow
     viewports via CSS. Items are rendered into #side-rail-list by script.js
     from data.yaml's `nav` list. -->
<nav class="side-rail" aria-label="Section navigation">
  <ol class="side-rail__list" id="side-rail-list"></ol>
</nav>

<!-- Icon-only theme toggle, fixed top-right. -->
<button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle color theme">
  <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"></circle>
    <path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
  </svg>
  <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"></path>
  </svg>
</button>

<main id="app-root">
  <!-- All content sections are injected at runtime by script.js from data.yaml -->
  <noscript>This page requires JavaScript to render its content from data.yaml.</noscript>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="script.js"></script>
</body>
</html>
